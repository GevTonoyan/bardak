name: boardify
description: "Boardify – Your Pocket Board Game Hub!"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1
  flutter: ">=3.38.3"

dependencies:
  cloud_firestore: ^6.1.0
  equatable: ^2.0.7
  firebase_core: ^4.2.1
  firebase_remote_config: ^6.1.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.2.1
  get_it: ^8.2.0
  go_router: ^16.2.4
  gradient_borders: ^1.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: any
  shared_preferences: ^2.5.3

dev_dependencies:
  build_runner: 2.10.4
  flutter_gen_runner: 5.12.0
  flutter_test:
    sdk: flutter

  very_good_analysis: ^10.0.0


flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/images/
    - assets/icons/flags/

  fonts:
    - family: NishikiTeki
      fonts:
        - asset: assets/fonts/NishikiTeki.ttf
    - family: Digitalt
      fonts:
        - asset: assets/fonts/Digitalt.ttf

flutter_gen:
  integrations:
    flutter_svg: true
  output: lib/assets/