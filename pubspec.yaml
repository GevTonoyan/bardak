name: bardak
description: "Bardak – Your Pocket Board Games!"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.10.1
  flutter: ">=3.41.6"

dependencies:
  audioplayers: 6.6.0
  cached_network_image: 3.4.1
  cloud_firestore: 6.3.0
  confetti: 0.8.0
  equatable: 2.0.8
  firebase_core: 4.7.0
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  flutter_blurhash: 0.9.1
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: 2.4.7
  flutter_svg: 2.2.4
  get_it: 9.2.1
  go_router: 17.2.3
  gradient_borders: 1.0.2
  hive: 2.2.3
  hive_flutter: 1.1.0
  intl: any
  package_info_plus: 10.1.0
  shared_preferences: 2.5.5

dev_dependencies:
  build_runner: 2.15.0
  flutter_gen_runner: 5.14.1
  flutter_launcher_icons: 0.14.4
  flutter_test:
    sdk: flutter
  very_good_analysis: 10.2.0


flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/sounds/
    - assets/images/
    - assets/icons/
    - assets/icons/flags/

  fonts:
    - family: NishikiTeki
      fonts:
        - asset: assets/fonts/NishikiTeki.ttf
    - family: Digitalt
      fonts:
        - asset: assets/fonts/Digitalt.ttf

flutter_gen:
  integrations:
    flutter_svg: true
  output: lib/assets/