name: Release
# Title shown in the Actions runs list.
run-name: Release ${{ inputs.platform }} (${{ inputs.bump }}) from ${{ github.ref_name }}

# builds main and uploads it to the Play internal testing track and/or TestFlight.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Where to upload the build
        type: choice
        options:
          - both
          - android
          - ios
        default: both
      bump:
        description: >-
          Version: auto keeps the version open in TestFlight, or bumps the
          patch once it is approved; minor/major for bigger releases
        type: choice
        options:
          - auto
          - minor
          - major
        default: auto

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Quality gate: the release jobs only start when this job passes.
  check:
    name: Analyze & test
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Allow releases from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases can only be started from main."
          exit 1

      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      # Shown at the top of the run's Summary page.
      - name: Write release info
        env:
          PLATFORM: ${{ inputs.platform }}
          BUMP: ${{ inputs.bump }}
        run: |
          commit_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          {
            echo "### Release info"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | [\`${GITHUB_SHA::7}\`]($commit_url) $(git log -1 --pretty=%s) |"
            echo "| Branch | \`$GITHUB_REF_NAME\` |"
            echo "| Started by | @$GITHUB_ACTOR |"
            echo "| Platform | $PLATFORM |"
            echo "| Version bump | $BUMP |"
            echo "| Flutter | $(flutter --version | head -1) |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # Fails the release if pubspec.lock is out of date with pubspec.yaml,
      # so the deploy jobs build exactly the package versions tested locally.
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # lib/main.dart imports this git-ignored file, so the analyzer reports
      # an error without it.
      - name: Write Firebase options
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
        run: echo "$FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart

      # Any analyzer issue (error, warning or info) fails the release.
      - name: Analyze
        run: flutter analyze

      # On GitHub Actions flutter test uses the github reporter, which turns
      # failures into annotations on the run summary.
      - name: Test
        run: flutter test

  # Picks the version once from App Store Connect, so both stores ship the
  # same version name without bumping pubspec.yaml. Runs on Linux: it only
  # calls Apple's API.
  version:
    name: Pick version
    needs: check
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    outputs:
      app_version: ${{ steps.pick.outputs.app_version }}
    steps:
      - uses: actions/checkout@v7

      # Reads ios/.ruby-version, runs bundle install and caches the gems.
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: ios
          bundler-cache: true

      - name: Pick version
        id: pick
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT_BASE64: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
        run: bundle exec fastlane ios version bump:${{ inputs.bump }}

  # Called workflows only see secrets the caller passes on, including the
  # production environment's. The repo has no repository-level secrets, so
  # inherit exposes nothing beyond that environment.
  android:
    name: Android → Play internal
    needs: version
    if: inputs.platform != 'ios'
    uses: ./.github/workflows/deploy-android.yml
    with:
      app_version: ${{ needs.version.outputs.app_version }}
    secrets: inherit

  ios:
    name: iOS → TestFlight
    needs: version
    if: inputs.platform != 'android'
    uses: ./.github/workflows/deploy-ios.yml
    with:
      app_version: ${{ needs.version.outputs.app_version }}
    secrets: inherit
