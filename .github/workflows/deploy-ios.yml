name: Deploy iOS

# Reusable workflow, called by release.yml: builds a signed IPA and uploads
# it to TestFlight via fastlane.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    name: Build & upload
    runs-on: macos-26
    # Environment secrets are only available to jobs that name the
    # environment, so it is set here rather than in the caller.
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      # Reads ios/.ruby-version, runs bundle install and caches the gems.
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: ios
          bundler-cache: true

      # Fail fast with the secret's name instead of confusing errors later.
      - name: Check secrets
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT_BASE64: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          for name in MATCH_DEPLOY_KEY GOOGLE_SERVICE_INFO_PLIST_BASE64 \
            FIREBASE_OPTIONS_DART_BASE64 ASC_KEY_ID ASC_ISSUER_ID \
            ASC_KEY_CONTENT_BASE64 MATCH_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is empty or not available."
              exit 1
            fi
          done

      # Lets match clone the private certificates repo over SSH, using a
      # read-only deploy key.
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}

      - name: Write Firebase files
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          echo "$FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart

      - name: Build and upload to TestFlight
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT_BASE64: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane ios beta
